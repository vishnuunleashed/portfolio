<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4527A0"/>
      <stop offset="55%" stop-color="#5E35B1"/>
      <stop offset="100%" stop-color="#7E57C2"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#B39DDB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B39DDB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- faint decorative task-list ticks, right side -->
