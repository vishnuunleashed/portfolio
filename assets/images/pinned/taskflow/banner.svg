    <line x1="920" y1="120" x2="1120" y2="120"/>
    <line x1="920" y1="230" x2="1180" y2="230"/>
    <line x1="920" y1="280" x2="1100" y2="280"/>
  </g>
  <g opacity="0.5" stroke="#D1C4E9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M872 62 L890 80 L924 46"/>
    <circle cx="898" cy="63" r="34" opacity="0.5"/>
    <path d="M872 222 L890 240 L924 206"/>
    <circle cx="898" cy="223" r="34" opacity="0.5"/>
  </g>

  <!-- App icon: checkmark badge, matches Icons.task_alt seed color -->
  <g transform="translate(90,108)">
    <circle cx="52" cy="52" r="52" fill="#FFFFFF"/>
    <circle cx="52" cy="52" r="52" fill="none" stroke="#4527A0" stroke-width="4" opacity="0.15"/>
    <path d="M30 54 L45 69 L76 34" fill="none" stroke="#5E35B1" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="222" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#FFFFFF">TaskFlow</text>
  <text x="224" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#E1D8F5">Offline-first task manager &#8212; Flutter, Firebase &amp; Riverpod</text>

