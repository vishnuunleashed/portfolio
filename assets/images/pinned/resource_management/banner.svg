      <stop offset="0%" stop-color="#0172A3"/>
      <stop offset="55%" stop-color="#0298DB"/>
      <stop offset="100%" stop-color="#4DB8F0"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- decorative grid dots -->
