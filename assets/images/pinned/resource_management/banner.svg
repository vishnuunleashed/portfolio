    <text x="0" y="98" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="500" fill="#EAF4FB">Plan people, projects and budgets from one clean mobile console.</text>
    <text x="0" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#CCEBF8">Flutter &#8226; Riverpod &#8226; go_router</text>
