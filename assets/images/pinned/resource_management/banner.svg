    <circle cx="1160" cy="80" r="3"/>
    <circle cx="1200" cy="80" r="3"/>
    <circle cx="1120" cy="120" r="3"/>
    <circle cx="1160" cy="120" r="3"/>
    <circle cx="1200" cy="120" r="3"/>
    <circle cx="1120" cy="160" r="3"/>
    <circle cx="1160" cy="160" r="3"/>
    <circle cx="1200" cy="160" r="3"/>
  </g>

  <!-- App icon mark -->
  <g transform="translate(90,120)">
    <rect width="120" height="120" rx="28" fill="#ffffff" opacity="0.95"/>
    <rect x="26" y="26" width="28" height="28" rx="6" fill="#0298DB"/>
    <rect x="66" y="26" width="28" height="28" rx="6" fill="#0298DB"/>
